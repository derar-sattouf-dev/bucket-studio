name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! For security issues, please use private reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
  - type: dropdown
    id: storage
    attributes:
      label: Storage provider
      options: [MinIO, AWS S3, Cloudflare R2, DigitalOcean Spaces, Backblaze B2, Other]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`docker compose logs backend` (or `backend-dev`) — please remove secrets and private URLs."
      render: shell
