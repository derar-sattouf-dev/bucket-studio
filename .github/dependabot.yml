version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # The AI SDKs change their API between majors; upgrade these by hand, with a key to test against.
      - dependency-name: openai
        update-types: ["version-update:semver-major"]
      - dependency-name: google-genai
        update-types: ["version-update:semver-major"]
      # OpenCV is used through basicsr/realesrgan, which target the 4.x API.
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /scripts/screenshots
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    ignore:
      # The backend stays on Python 3.11: the pinned torch wheels are built for it.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
