version: 2
updates:
  # Python: only the dev tools. requirements.txt is a platform-specific lock (CPU-only torch) that
  # Dependabot cannot regenerate correctly; the weekly CI run audits it and it is upgraded by hand.
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    allow:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
      - dependency-name: ruff
      - dependency-name: mypy
      - dependency-name: pip-audit
    groups:
      dev-tools:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /scripts/screenshots
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly }
    ignore:
      # The backend stays on Python 3.11: the lock file is resolved for it.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
