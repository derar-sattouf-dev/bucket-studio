# Optional: deploy to your own server over SSH after CI passes on main.
# Disabled unless the repository variable DEPLOY_ENABLED is "true", so forks never run it.
# Secrets: SERVER_HOST, SERVER_USER, SERVER_SSH_KEY, SERVER_SSH_FINGERPRINT
#   (fingerprint pins the host key: `ssh-keyscan host | ssh-keygen -lf - -E sha256`)
# Variables: DEPLOY_ENABLED=true, DEPLOY_PATH (default ~/bucket-studio)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # `branches: [main]` above matches the *name* of the head branch, so a pull request from a fork's
    # own `main` would pass it. Only a push to this repository's main may deploy.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/bucket-studio' }}
        with:
          command_timeout: 30m
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "${DEPLOY_PATH/#\~/$HOME}"
            git pull --ff-only
            docker compose --profile prod up --build -d
            docker image prune -f
